name: Deploy Jibli Static

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Attach application layers and validate
        run: python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="customer.css">'
          scripts=['<script src="customer-app.js"></script>','<script src="customer-live.js"></script>','<script src="customer-pro.js"></script>','<script src="customer-v2.js"></script>','<script src="admin.js"></script>','<script src="dashboard.js"></script>']
          if css not in s: s=s.replace('</head>',css+'</head>')
          for x in scripts:
              if x not in s: s=s.replace('</body>',x+'</body>')
          p.write_text(s,encoding='utf-8')
          required=['customer.css','customer-app.js','customer-live.js','customer-pro.js','customer-v2.js','admin.js','dashboard.js','index.html']
          missing=[x for x in required if not Path(x).exists()]
          if missing: raise SystemExit('Missing required files: '+', '.join(missing))
          print('Validated customer/admin assets:', ', '.join(required))
          print('Single Pages deployment workflow ready')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
