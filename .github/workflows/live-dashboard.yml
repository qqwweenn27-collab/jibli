name: Deploy Jibli Live Dashboard

on:
  workflow_run:
    workflows: ["Deploy Jibli Static"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Attach customer and live dashboard layers
        run: python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          additions=['<link rel="stylesheet" href="customer.css">','<script src="customer-app.js" defer></script>','<script src="customer-live.js" defer></script>','<script src="dashboard.js" defer></script>']
          for item in additions:
              if item not in s:
                  s=s.replace('</head>', item+'</head>') if item.startswith('<link') else s
          for item in additions[1:]:
              if item not in s:
                  s=s.replace('</body>', item+'</body>')
          p.write_text(s,encoding='utf-8')
          print('customer and dashboard layers attached')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
