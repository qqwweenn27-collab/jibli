<script>
const SB_URL='https://hsgqqugojpeynmxiktrx.supabase.co';
const SB_KEY='sb_publishable_M5okA1lwG2OEif5cMVYCiA_763LRInd';
const DEMO_RESTS=[
{id:'r1',name:'مطعم الجود',category:'عراقي',rating:4.8,delivery:1500,time:'25-35 دقيقة',image:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=80'},
{id:'r2',name:'بيت البرغر',category:'برغر',rating:4.7,delivery:2000,time:'20-30 دقيقة',image:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80'},
{id:'r3',name:'بيتزا جيبلي',category:'بيتزا',rating:4.9,delivery:1500,time:'25-40 دقيقة',image:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=500&q=80'},
{id:'r4',name:'مطبخ بغداد',category:'شرقي',rating:4.6,delivery:1000,time:'30-45 دقيقة',image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=500&q=80'}];
const DEMO_ITEMS={r1:[['كبسة دجاج','أرز بسمتي ودجاج وتوابل عراقية',9000,'🍗'],['كباب عراقي','كباب لحم مع خبز وسلطة',8000,'🥙'],['مرق بامية','بامية عراقية مع أرز',7000,'🍲']],r2:[['برغر كلاسيك','لحم بقري، جبن، صوص خاص',8500,'🍔'],['تشيكن برغر','دجاج مقرمش وخضار',8000,'🍔'],['بطاطا مقلية','بطاطا مع صوص',3500,'🍟']],r3:[['بيتزا بيبروني','جبن، بيبروني، صوص طماطم',10000,'🍕'],['بيتزا دجاج','دجاج، فطر، جبن',9500,'🍕'],['مارغريتا','طماطم، موزاريلا، ريحان',8000,'🍕']],r4:[['تشريب لحم','لحم وخبز ومرق غني',9000,'🥘'],['دولمة عراقية','خضار محشية مشكلة',8500,'🍃'],['قوزي','أرز ولحم ومكسرات',12000,'🍖']]};
let state={page:'home',user:JSON.parse(localStorage.getItem('jibli_user')||'null'),cart:JSON.parse(localStorage.getItem('jibli_cart')||'[]'),orders:JSON.parse(localStorage.getItem('jibli_orders')||'[]'),rests:DEMO_RESTS,selectedRest:null,category:'all',adminTab:'overview',driverOnline:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=n=>new Intl.NumberFormat('ar-IQ').format(n)+' د.ع';
function save(){localStorage.setItem('jibli_user',JSON.stringify(state.user));localStorage.setItem('jibli_cart',JSON.stringify(state.cart));localStorage.setItem('jibli_orders',JSON.stringify(state.orders))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),2600)}
function go(p){state.page=p;render();scrollTo(0,0)}
function back(){go(state.page==='restaurant'?'restaurants':'home')}
function cartCount(){return state.cart.reduce((a,x)=>a+x.qty,0)}
function layout(body,title=''){return `<div class="shell"><header class="top"><div class="brand"><div class="logo">ج</div><div><b>جيبلي</b><small>كل احتياجاتك .. بمكان واحد</small></div></div><button class="iconbtn" onclick="openNotifications()">🔔</button></header><main class="content">${body}</main>${nav()}<div class="footer">جيبلي • نسخة الويب الموحدة</div></div>`}
function nav(){return `<nav class="bottom"><button class="nav ${state.page==='home'?'active':''}" onclick="go('home')"><b>⌂</b>الرئيسية</button><button class="nav ${['taxi','delivery'].includes(state.page)?'active':''}" onclick="go('taxi')"><b>🚕</b>مشوار</button><button class="nav ${['restaurants','restaurant'].includes(state.page)?'active':''}" onclick="go('restaurants')"><b>🍔</b>مطاعم</button><button class="nav ${state.page==='orders'?'active':''}" onclick="go('orders')"><b style="position:relative">▣${cartCount()?`<i class="badge">${cartCount()}</i>`:''}</b>طلباتي</button><button class="nav ${state.page==='profile'?'active':''}" onclick="go('profile')"><b>♙</b>حسابي</button></nav>`}
function pageHead(t){return `<div class="pagehead"><button class="back" onclick="back()">→</button><h1>${t}</h1></div>`}
function home(){return layout(`<section class="hero"><h1>هلا بك في <span class="gold">جيبلي</span> 👋</h1><p>تكسي، دليفري، مطاعم وكل احتياجاتك اليومية — بخدمة واحدة سهلة وسريعة.</p><button class="btn primary" onclick="go('taxi')">اطلب مشوار الآن 🚕</button></section><div class="grid3"><button class="service" onclick="go('taxi')"><div class="ico">🚕</div><b>تكسي</b><span>مشاوير سريعة</span></button><button class="service" onclick="go('delivery')"><div class="ico">📦</div><b>دليفري</b><span>أرسل واستلم</span></button><button class="service" onclick="go('restaurants')"><div class="ico">🍔</div><b>مطاعم</b><span>اطلب أكلك</span></button></div><section class="section"><div class="sectionhead"><h2>الأكثر طلباً</h2><button class="link" onclick="go('restaurants')">عرض الكل</button></div><div class="cards">${state.rests.slice(0,3).map(restCard).join('')}</div></section><section class="section"><div class="sectionhead"><h2>خدمات جيبلي</h2></div><div class="cards"><div class="notice">📍 <b>تحديد موقعك</b><br>استخدم موقع الجهاز لتسهيل اختيار نقطة الانطلاق والوصول.</div><div class="notice">💳 <b>دفع مرن</b><br>نقدي أو إلكتروني عند تفعيل بوابة الدفع الخاصة بك.</div></div></section>`)}
function restCard(r){return `<button class="card restaurant" onclick="openRest('${r.id}')"><img class="foodpic" src="${r.image}" alt=""><div class="restinfo"><h3>${esc(r.name)}</h3><div class="meta"><span class="rating">★ ${r.rating}</span> • ${esc(r.category)}<br>🛵 ${money(r.delivery)} • ${r.time}</div></div><span>‹</span></button>`}
function restaurants(){const filtered=state.rests.filter(r=>state.category==='all'||r.category===state.category);return layout(`${pageHead('المطاعم')}<div class="chips"><button class="chip ${state.category==='all'?'active':''}" onclick="setCat('all')">الكل</button>${['عراقي','برغر','بيتزا','شرقي'].map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div><div class="section"><div class="cards">${filtered.map(restCard).join('')}</div></div>`)}
function setCat(c){state.category=c;render()}
function openRest(id){state.selectedRest=id;state.page='restaurant';render()}
function restaurant(){const r=state.rests.find(x=>x.id===state.selectedRest)||state.rests[0];const items=DEMO_ITEMS[r.id]||[];return layout(`${pageHead(r.name)}<div class="card"><div class="restaurant"><img class="foodpic" src="${r.image}"><div class="restinfo"><h3>${esc(r.name)}</h3><div class="meta"><span class="rating">★ ${r.rating}</span> • ${r.category}<br>🛵 ${money(r.delivery)} • ${r.time}</div></div></div></div><div class="sectionhead" style="margin-top:20px"><h2>القائمة</h2><span class="meta">${items.length} أصناف</span></div><div class="cards">${items.map((it,i)=>itemCard(r,it,i)).join('')}</div><button class="btn primary full" style="margin-top:15px" onclick="go('cart')">فتح السلة ${cartCount()?`(${cartCount()})`:''}</button>`)}
function itemCard(r,it,i){return `<div class="card"><div class="restaurant"><div class="foodpic" style="display:grid;place-items:center;font-size:35px">${it[3]}</div><div class="restinfo"><h3>${esc(it[0])}</h3><div class="meta">${esc(it[1])}</div><div class="price" style="margin-top:7px">${money(it[2])}</div></div><button class="btn primary" onclick="addCart('${r.id}',${i})">+</button></div></div>`}
function addCart(rid,i){const r=state.rests.find(x=>x.id===rid),it=DEMO_ITEMS[rid][i],key=rid+'-'+i;const x=state.cart.find(x=>x.key===key);if(x)x.qty++;else state.cart.push({key,rid,rest:r.name,name:it[0],price:it[2],qty:1,emoji:it[3]});save();toast('تمت الإضافة إلى السلة 🛒');render()}
function cart(){if(!state.cart.length)return layout(`${pageHead('السلة')}<div class="empty"><div class="ico">🛒</div><h3>السلة فارغة</h3><p>اختر مطعماً وأضف الأصناف التي تحبها.</p><button class="btn primary" onclick="go('restaurants')">استعراض المطاعم</button></div>`);const subtotal=state.cart.reduce((a,x)=>a+x.price*x.qty,0),delivery=1500,total=subtotal+delivery;return layout(`${pageHead('السلة')}<div class="cards">${state.cart.map((x,i)=>`<div class="card order"><div style="font-size:28px">${x.emoji}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="meta">${esc(x.rest)}<br>${money(x.price)} × ${x.qty}</div></div><div class="row"><button class="btn secondary" onclick="changeQty(${i},-1)">−</button><button class="btn secondary" onclick="changeQty(${i},1)">+</button></div></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="total"><span>المجموع</span><b>${money(subtotal)}</b></div><div class="total"><span>التوصيل</span><b>${money(delivery)}</b></div><div class="total"><span>الإجمالي</span><strong class="price gold">${money(total)}</strong></div><button class="btn primary full" onclick="go('checkout')">متابعة الطلب</button></div>`)}
function changeQty(i,d){state.cart[i].qty+=d;if(state.cart[i].qty<=0)state.cart.splice(i,1);save();render()}
function checkout(){if(!state.cart.length)return go('cart');const subtotal=state.cart.reduce((a,x)=>a+x.price*x.qty,0),total=subtotal+1500;return layout(`${pageHead('تأكيد الطلب')}<div class="notice warning">📍 اكتب عنوان التوصيل بدقة حتى يصل السائق بسهولة.</div><div class="section form"><div class="field"><label>الاسم</label><input id="coName" value="${esc(state.user?.name||'')}" placeholder="اسم المستلم"></div><div class="field"><label>رقم الهاتف</label><input id="coPhone" value="${esc(state.user?.phone||'')}" placeholder="07xxxxxxxxx"></div><div class="field"><label>العنوان</label><textarea id="coAddr" class="textarea" placeholder="المنطقة، الشارع، أقرب نقطة دالة"></textarea></div><div class="field"><label>طريقة الدفع</label><select id="coPay"><option value="cash">نقداً عند الاستلام</option><option value="electronic">دفع إلكتروني</option></select></div></div><div class="card"><div class="total"><span>الإجمالي</span><strong class="price gold">${money(total)}</strong></div><button class="btn primary full" onclick="placeFoodOrder()">تأكيد الطلب 🍔</button></div>`)}
async function placeFoodOrder(){const name=document.getElementById('coName').value.trim(),phone=document.getElementById('coPhone').value.trim(),addr=document.getElementById('coAddr').value.trim(),pay=document.getElementById('coPay').value;if(!name||!phone||!addr)return toast('أكمل بيانات الطلب أولاً');const total=state.cart.reduce((a,x)=>a+x.price*x.qty,0)+1500;const order={id:'JB-'+Date.now().toString().slice(-7),type:'food',status:'pending',name,phone,address:addr,payment:pay,total,items:[...state.cart],created:new Date().toISOString()};state.orders.unshift(order);state.cart=[];save();await supabaseInsert('food_orders',{status:'pending',total_amount:total,delivery_address:addr,notes:'طلب من نسخة جيبلي الموحدة'});toast('تم استلام طلبك بنجاح ✅');go('orders')}
function orders(){if(!state.orders.length)return layout(`${pageHead('طلباتي')}<div class="empty"><div class="ico">📋</div><h3>لا توجد طلبات بعد</h3><p>طلباتك من المطاعم والمشاوير ستظهر هنا.</p><button class="btn primary" onclick="go('restaurants')">ابدأ طلبك</button></div>`);return layout(`${pageHead('طلباتي')}<div class="tabs"><button class="tab active">الكل</button><button class="tab">جارية</button><button class="tab">مكتملة</button></div><div class="cards">${state.orders.map((o,i)=>`<button class="card order" onclick="openOrder(${i})"><div style="font-size:29px">${o.type==='food'?'🍔':'🚕'}</div><div style="flex:1;text-align:right"><b>${o.type==='food'?'طلب مطعم':'رحلة تكسي'}</b><div class="meta">${o.id}<br>${new Date(o.created).toLocaleString('ar-IQ')}</div></div><span class="status">${statusText(o.status)}</span>‹</button>`).join('')}</div>`)}
function statusText(s){return ({pending:'قيد المراجعة',accepted:'تم القبول',preparing:'قيد التحضير',ready:'جاهز',picked_up:'تم الاستلام',on_the_way:'في الطريق',delivered:'تم التسليم',requested:'مطلوبة',arriving:'السائق في الطريق',in_progress:'جارية',completed:'مكتملة',cancelled:'ملغاة'})[s]||s}
function openOrder(i){state.selectedOrder=i;state.page='order';render()}
function order(){const o=state.orders[state.selectedOrder];if(!o)return go('orders');const statuses=o.type==='food'?['pending','accepted','preparing','on_the_way','delivered']:['requested','accepted','arriving','in_progress','completed'];const cur=statuses.indexOf(o.status);return layout(`${pageHead('تفاصيل الطلب')}<div class="card"><div class="order"><div style="font-size:30px">${o.type==='food'?'🍔':'🚕'}</div><div><b>${o.id}</b><div class="meta">${o.type==='food'?'طلب مطعم':'رحلة تكسي'}</div></div><span class="status">${statusText(o.status)}</span></div></div><div class="progress">${statuses.map((s,i)=>`<div class="step ${i<=cur?'on':''}"><div class="dot">${i<=cur?'✓':''}</div><span>${statusText(s)}</span></div>${i<statuses.length-1?'<div class="sep"></div>':''}`).join('')}</div>${o.type==='food'?`<div class="map"><div class="maplabel">تتبع التوصيل</div><div class="pin">📍</div></div><div class="card" style="margin-top:12px"><b>عنوان التوصيل</b><p class="meta">${esc(o.address)}</p><div class="total"><span>الإجمالي</span><b class="gold">${money(o.total)}</b></div></div>`:`<div class="map"><div class="maplabel">تتبع السائق</div><div class="pin">🚕</div></div><div class="card" style="margin-top:12px"><b>معلومات الرحلة</b><p class="meta">سيظهر موقع السائق وتفاصيل السيارة هنا عند ربط خدمة الخرائط والتتبع.</p></div>`}`)}
function taxi(){return layout(`${pageHead('طلب تكسي')}<div class="map"><div class="maplabel">موقع الانطلاق</div><div class="pin">📍</div></div><div class="section form"><div class="field"><label>من أين؟</label><input id="taxiFrom" placeholder="موقع الانطلاق"></div><div class="field"><label>إلى أين؟</label><input id="taxiTo" placeholder="الوجهة"></div><div class="row"><div class="field"><label>نوع الرحلة</label><select id="taxiType"><option>اقتصادي</option><option>عائلي</option><option>VIP</option></select></div><div class="field"><label>الدفع</label><select id="taxiPay"><option>نقداً</option><option>إلكتروني</option></select></div></div><button class="btn primary full" onclick="requestTaxi()">ابحث عن سائق 🚕</button></div><div class="notice">💡 السعر النهائي يعتمد على المسافة والتسعيرة المعتمدة في منطقتك.</div>`)}
async function requestTaxi(){const f=document.getElementById('taxiFrom').value.trim(),t=document.getElementById('taxiTo').value.trim();if(!f||!t)return toast('أدخل نقطة الانطلاق والوجهة');const o={id:'JB-'+Date.now().toString().slice(-7),type:'ride',status:'requested',from:f,to:t,total:0,created:new Date().toISOString()};state.orders.unshift(o);save();await supabaseInsert('rides',{pickup_address:f,destination_address:t,status:'requested'});toast('تم إرسال طلب التكسي 🚕');go('orders')}
function delivery(){return layout(`${pageHead('دليفري')}<div class="hero"><h1>أرسلها مع جيبلي 📦</h1><p>اطلب استلام وتسليم أي غرض داخل منطقتك.</p></div><div class="form"><div class="field"><label>عنوان الاستلام</label><input id="dFrom" placeholder="من أين نستلم؟"></div><div class="field"><label>عنوان التسليم</label><input id="dTo" placeholder="إلى أين نوصل؟"></div><div class="field"><label>تفاصيل الشحنة</label><textarea id="dNote" class="textarea" placeholder="مثال: مستندات، طرد صغير..."></textarea></div><div class="row"><div class="field"><label>حجم الشحنة</label><select><option>صغيرة</option><option>متوسطة</option><option>كبيرة</option></select></div><div class="field"><label>الدفع</label><select><option>نقداً</option><option>إلكتروني</option></select></div></div><button class="btn primary full" onclick="requestDelivery()">طلب مندوب 📦</button></div>`)}
function requestDelivery(){const f=document.getElementById('dFrom').value.trim(),t=document.getElementById('dTo').value.trim();if(!f||!t)return toast('أكمل عناوين الاستلام والتسليم');state.orders.unshift({id:'JB-'+Date.now().toString().slice(-7),type:'delivery',status:'requested',from:f,to:t,total:0,created:new Date().toISOString()});save();toast('تم إنشاء طلب الدليفري');go('orders')}
function profile(){if(!state.user)return layout(`${pageHead('حسابي')}<div class="empty"><div class="ico">♙</div><h3>سجّل دخولك</h3><p>لإدارة الطلبات والعناوين والحساب.</p><button class="btn primary" onclick="go('login')">تسجيل الدخول</button></div>`);return layout(`${pageHead('حسابي')}<div class="card"><div class="restaurant"><div class="logo">${esc((state.user.name||'ج')[0])}</div><div><h3 style="margin:0">${esc(state.user.name)}</h3><div class="meta">${esc(state.user.email||state.user.phone||'مستخدم جيبلي')}</div></div></div></div><div class="section cards"><button class="card" style="text-align:right" onclick="toast('العناوين جاهزة للربط مع Supabase')">📍 عناويني <span style="float:left">‹</span></button><button class="card" style="text-align:right" onclick="go('driver')">🚗 وضع السائق <span style="float:left">‹</span></button><button class="card" style="text-align:right" onclick="go('admin')">⚙️ لوحة الإدارة <span style="float:left">‹</span></button><button class="btn danger full" onclick="logout()">تسجيل الخروج</button></div>`)}
function login(){return `<div class="auth"><div class="authbox"><div class="authlogo"><div class="logo">ج</div><h1>جيبلي</h1><p>كل احتياجاتك .. بمكان واحد</p></div><div class="tabs"><button id="lt" class="tab active" onclick="authMode('login')">دخول</button><button id="rt" class="tab" onclick="authMode('register')">حساب جديد</button></div><div id="authform">${authForm('login')}</div></div></div>`}
function authForm(mode){return `<div class="form"><div class="field"><label>الاسم</label><input id="authName" class="${mode==='login'?'hide':''}" placeholder="الاسم الكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="authEmail" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="authPass" type="password" placeholder="••••••••"></div><button class="btn primary full" onclick="auth('${mode}')">${mode==='login'?'تسجيل الدخول':'إنشاء الحساب'}</button><button class="btn secondary full" onclick="demoLogin()">الدخول التجريبي</button></div>`}
function authMode(m){document.getElementById('authform').innerHTML=authForm(m);document.getElementById('lt').classList.toggle('active',m==='login');document.getElementById('rt').classList.toggle('active',m==='register')}
async function auth(mode){const email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPass').value,name=document.getElementById('authName').value.trim();if(!email||!pass||(mode==='register'&&!name))return toast('أكمل البيانات');try{const endpoint=SB_URL+'/auth/v1/'+(mode==='login'?'token?grant_type=password':'signup');const res=await fetch(endpoint,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});const data=await res.json();if(!res.ok)throw Error(data.msg||data.error_description||'تعذر تسجيل الدخول');state.user={name:name||email.split('@')[0],email,access_token:data.access_token||null};save();toast(mode==='login'?'تم تسجيل الدخول':'تم إنشاء الحساب');go('home')}catch(e){toast('تعذر الاتصال بالخادم — استخدم الدخول التجريبي')} }
function demoLogin(){state.user={name:'عميل جيبلي',email:'demo@jibli.app',phone:'07700000000',demo:true};save();go('home');toast('مرحباً بك في جيبلي 👋')}
function logout(){state.user=null;save();go('login')}
function driver(){return layout(`${pageHead('وضع السائق')}<div class="hero"><h1>مرحباً بك يا سائق 👋</h1><p>استقبل الرحلات وطلبات التوصيل وأدر أرباحك من مكان واحد.</p><div class="switch"><span>حالة السائق: <b class="gold">${state.driverOnline?'متاح':'غير متاح'}</b></span><input type="checkbox" ${state.driverOnline?'checked':''} onchange="state.driverOnline=this.checked;render()"></div></div><div class="statgrid"><div class="stat"><span>رحلات اليوم</span><b>12</b></div><div class="stat"><span>أرباح اليوم</span><b class="gold">${money(68000)}</b></div><div class="stat"><span>التقييم</span><b>4.9 ★</b></div><div class="stat"><span>طلبات جديدة</span><b>3</b></div></div><div class="section cards"><div class="card"><b>الطلبات الواردة</b><p class="meta">عند تفعيل الحالة سيظهر هنا أقرب طلب مع أزرار القبول والرفض والتوجيه.</p><div class="row"><button class="btn primary" onclick="toast('تم قبول الطلب')">قبول</button><button class="btn secondary" onclick="toast('تم رفض الطلب')">رفض</button></div></div><div class="notice">🗺️ الملاحة الحقيقية تحتاج مزود خرائط ومفتاح API.</div></div>`)}
function admin(){const tabs=['overview','orders','drivers'];return layout(`${pageHead('لوحة الإدارة')}<div class="adminnav">${tabs.map(x=>`<button class="${state.adminTab===x?'active':''}" onclick="state.adminTab='${x}';render()">${x==='overview'?'الرئيسية':x==='orders'?'الطلبات':'السائقون'}</button>`).join('')}</div>${state.adminTab==='overview'?adminOverview():state.adminTab==='orders'?adminOrders():adminDrivers()}`)}
function adminOverview(){return `<div class="section statgrid"><div class="stat"><span>إجمالي الطلبات</span><b>${state.orders.length+128}</b></div><div class="stat"><span>إيرادات اليوم</span><b class="gold">${money(1240000)}</b></div><div class="stat"><span>السائقون المتاحون</span><b>27</b></div><div class="stat"><span>المطاعم</span><b>${state.rests.length}</b></div></div><div class="card"><b>ملخص النظام</b><p class="meta">إدارة المستخدمين، السائقين، المطاعم، الطلبات، العمولات، المناطق والكوبونات يمكن ربطها مباشرة بجداول Supabase الموجودة.</p></div>`}
function adminOrders(){return `<div class="section cards">${state.orders.slice(0,8).map(o=>`<div class="card order"><span style="font-size:24px">${o.type==='food'?'🍔':'🚕'}</span><div style="flex:1"><b>${o.id}</b><div class="meta">${statusText(o.status)}</div></div><button class="btn secondary" onclick="advanceOrder('${o.id}')">تحديث</button></div>`).join('')||'<div class="empty">لا توجد طلبات محلية</div>'}</div>`}
function advanceOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const seq=o.type==='food'?['pending','accepted','preparing','ready','picked_up','on_the_way','delivered']:['requested','accepted','arriving','in_progress','completed'];const i=seq.indexOf(o.status);o.status=seq[Math.min(i+1,seq.length-1)];save();render();toast('تم تحديث حالة الطلب')}
function adminDrivers(){return `<div class="section cards"><div class="card"><b>السائقون المتصلون</b><p class="meta">27 سائقاً متاحاً • 8 في رحلات • 4 غير متاحين</p></div><div class="card"><b>إدارة التسعيرة</b><div class="row" style="margin-top:10px"><input value="1500" aria-label="base fare"><input value="500" aria-label="per km"></div></div></div>`}
function openNotifications(){document.getElementById('modalbox').innerHTML='<h2>الإشعارات 🔔</h2><div class="cards"><div class="notice">🎉 أهلاً بك في جيبلي. استكشف خدمات التكسي والدليفري والمطاعم.</div><div class="notice">📦 ستظهر تحديثات طلباتك هنا بشكل فوري عند تفعيل Realtime.</div></div><button class="btn primary full" style="margin-top:14px" onclick="closeModal()">إغلاق</button>';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function supabaseInsert(table,row){try{await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)})}catch(e){console.log('supabase offline',e)}}
async function loadRemoteRestaurants(){try{const r=await fetch(SB_URL+'/rest/v1/restaurants?select=*&limit=20',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});if(r.ok){const data=await r.json();if(Array.isArray(data)&&data.length){state.rests=data.map(x=>({id:x.id,name:x.name,category:x.category||'مطاعم',rating:x.rating||4.5,delivery:x.delivery_fee||1500,time:x.estimated_delivery_time||'30-40 دقيقة',image:x.image_url||DEMO_RESTS[0].image}));render()}}}catch(e){}}
function render(){let out;if(state.page==='home')out=home();else if(state.page==='restaurants')out=restaurants();else if(state.page==='restaurant')out=restaurant();else if(state.page==='cart')out=cart();else if(state.page==='checkout')out=checkout();else if(state.page==='orders')out=orders();else if(state.page==='order')out=order();else if(state.page==='taxi')out=taxi();else if(state.page==='delivery')out=delivery();else if(state.page==='profile')out=profile();else if(state.page==='login')out=login();else if(state.page==='driver')out=driver();else if(state.page==='admin')out=admin();else out=home();document.getElementById('app').innerHTML=out}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if(!state.user&&location.hash==='#login')state.page='login';render();loadRemoteRestaurants();
</script></body></html>
